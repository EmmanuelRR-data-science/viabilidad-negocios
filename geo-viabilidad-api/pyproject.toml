[project]
name = "geo-viabilidad-api"
version = "1.0.0"
description = "API FastAPI de GeoViabilidad Hook — motor analítico, pagos e informes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "fastapi>=0.109.0",
    "fiona>=1.9.0",
    "geo-viabilidad-data",
    "google-auth>=2.29.0",
    "matplotlib>=3.8.0",
    "mercadopago>=2.2.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.5.0",
    "pyjwt>=2.8.0",
    "pyproj>=3.5.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.0.0",
    "requests>=2.31.0",
    "shapely>=2.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.27.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.uv]
package = false
link-mode = "copy"

[tool.uv.sources]
geo-viabilidad-data = { path = "../geo-viabilidad-data", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["scratch/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.0"
version_files = ["VERSION", "pyproject.toml:^version"]
tag_format = "v$version"
