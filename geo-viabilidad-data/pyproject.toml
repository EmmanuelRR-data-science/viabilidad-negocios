[project]
name = "geo-viabilidad-data"
version = "0.1.0"
description = "Modelos ORM, conexión PostGIS e ingesta INEGI compartidos entre API y Admin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fiona>=1.9.0",
    "pandas>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pyproj>=3.5.0",
    "python-dotenv>=1.0.0",
    "shapely>=2.0.0",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.uv]
link-mode = "copy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geo_viabilidad_data"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
