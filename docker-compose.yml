version: '3.8'

services:
  geo-db:
    image: postgis/postgis:16-3.4
    container_name: geo-analisis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-geoanalisis}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin_password_safe}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - geo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-geoanalisis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viabilidad-hook-admin
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-admin_password_safe}
      - DB_HOST=geo-analisis-db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-geoanalisis}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-PhiQus}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-viabilidad-negocios}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-dev-admin-secret-change-me}
      - FUENTES_DIR=/app/fuentes
      - ADMIN_MAX_UPLOAD_MB=${ADMIN_MAX_UPLOAD_MB:-600}
      - FLASK_DEBUG=${FLASK_DEBUG:-1}
    volumes:
      - ./admin:/app/admin
      - ./app:/app/app
      - ./fuentes:/app/fuentes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      geo-db:
        condition: service_healthy
    networks:
      - geo-network
    restart: always

  web-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viabilidad-hook-api
    entrypoint: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    environment:
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-admin_password_safe}
      - DB_HOST=geo-analisis-db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-geoanalisis}
      - DEV_MODE=${DEV_MODE:-True}
      - PAYMENTS_MOCK=${PAYMENTS_MOCK:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_REPORTS_BUCKET=${S3_REPORTS_BUCKET:-viabilidad-hook-informes}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-meta.llama3-70b-instruct-v1:0}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN:-}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY:-}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-}
      - BESTTIME_API_KEY=${BEST_TIME_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-}
    volumes:
      - ./frontend:/app/frontend
      - ./app:/app/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      geo-db:
        condition: service_healthy
    networks:
      - geo-network
    restart: always

volumes:
  postgres_data:
    name: geoanalisis-sdd_postgres_data
    external: true

networks:
  geo-network:
    name: geoanalisis-sdd_geo-network
