# Proxy unificado AEDMI: un solo puerto público (3000) para UI + API.
# La API interna escucha en 127.0.0.1:8080; el frontend Next.js en 127.0.0.1:3001.
server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    client_max_body_size 50m;

    # Rutas FastAPI (prefijos montados en main.py)
    location ~ ^/(auth|indicadores|analisis|admin|infraestructura|mapa|export|health|docs|redoc|openapi\.json) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Next.js (UI)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
